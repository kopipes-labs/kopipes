<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-label="Services publish to the bus and read from a channel">

  <style>
    .sans { font-family: Helvetica, Arial, sans-serif; }
    .mono { font-family: SFMono-Regular, Menlo, Consolas, monospace; }
    .kicker { font-family: SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
    .title { font-family: Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #141A2E; }
    .sub { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #5B6270; }
    .code { font-family: SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #141A2E; }
    .label { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #141A2E; }
    .note { font-family: Helvetica, Arial, sans-serif; font-size: 13px; font-style: italic; fill: #5B6270; }
  </style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141A2E"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5489B"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C4511A"/></marker><marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B5CF6"/></marker></defs>
<rect width="1120" height="560" fill="#FFFFFF"/>
<text x="40" y="44" class="kicker" fill="#C4511A">PATTERN · EVENT HUB</text>
<text x="40" y="80" class="sans" font-size="28" font-weight="700" fill="#141A2E">Services publish to the bus and read from a channel</text>
<rect x="40" y="140" width="190" height="70" rx="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
<text x="56" y="164" class="kicker" fill="#8B5CF6">PUBLISH</text>
<text x="56" y="186" class="title">Control service</text>
<rect x="40" y="240" width="190" height="70" rx="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
<text x="56" y="264" class="kicker" fill="#8B5CF6">PUBLISH</text>
<text x="56" y="286" class="title">BFF trigger</text>
<rect x="40" y="340" width="190" height="70" rx="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
<text x="56" y="364" class="kicker" fill="#8B5CF6">PUBLISH</text>
<text x="56" y="386" class="title">Ingress gateways</text>
<rect x="290" y="110" width="520" height="360" rx="14" fill="#FCEFF6" stroke="#E5489B" stroke-width="2"/>
<text x="310" y="138" class="kicker" fill="#E5489B">EVENT HUB · EventHub construct</text>
<rect x="320" y="240" width="190" height="90" rx="10" fill="#FFFFFF" stroke="#E5489B" stroke-width="2"/>
<text x="336" y="264" class="kicker" fill="#E5489B">EVENTBRIDGE</text>
<text x="336" y="286" class="title">Bus</text>
<text x="336" y="306" class="sub">routes by rules</text>
<rect x="590" y="150" width="190" height="90" rx="10" fill="#FFFFFF" stroke="#E5489B" stroke-width="2"/>
<text x="606" y="174" class="kicker" fill="#E5489B">KINESIS</text>
<text x="606" y="196" class="title">Channel s1</text>
<text x="606" y="216" class="sub">ordered per key</text>
<rect x="590" y="360" width="190" height="90" rx="10" fill="#FFFFFF" stroke="#E5489B" stroke-width="2"/>
<text x="606" y="384" class="kicker" fill="#E5489B">ARCHIVE · LOGS</text>
<text x="606" y="406" class="title">Archive, logs</text>
<text x="606" y="426" class="sub">replay · debugging</text>
<path d="M230,175 H262 V285 H318" fill="none" stroke="#141A2E" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M230,275 H262 V285 H318" fill="none" stroke="#141A2E" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M230,375 H262 V285 H318" fill="none" stroke="#141A2E" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M510,265 H550 V195 H588" fill="none" stroke="#E5489B" stroke-width="1.8" marker-end="url(#p)"/>
<path d="M415,330 V405 H588" fill="none" stroke="#E5489B" stroke-width="1.8" marker-end="url(#p)"/>
<text x="530" y="230" text-anchor="middle" class="label" fill="#E5489B">rule</text>
<rect x="880" y="150" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
<text x="896" y="174" class="kicker" fill="#8B5CF6">CONSUME</text>
<text x="896" y="196" class="title">Listeners</text>
<text x="896" y="216" class="sub">each service reads</text>
<text x="896" y="233" class="sub">the channel</text>
<rect x="880" y="260" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#C4511A" stroke-width="2"/>
<text x="896" y="284" class="kicker" fill="#C4511A">EventLake</text>
<text x="896" y="306" class="title">Event lake</text>
<text x="896" y="326" class="sub">every event but faults</text>
<text x="896" y="343" class="sub">Firehose → S3</text>
<rect x="880" y="370" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#C4511A" stroke-width="2"/>
<text x="896" y="394" class="kicker" fill="#C4511A">FaultMonitor</text>
<text x="896" y="416" class="title">Fault monitor</text>
<text x="896" y="436" class="sub">faults only</text>
<text x="896" y="453" class="sub">Firehose → S3 · SNS</text>
<path d="M780,195 H878" fill="none" stroke="#141A2E" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M510,305 H878" fill="none" stroke="#E5489B" stroke-width="1.8" marker-end="url(#p)"/>
<path d="M850,305 V415 H878" fill="none" stroke="#E5489B" stroke-width="1.8" marker-end="url(#p)"/>
<text x="700" y="297" text-anchor="middle" class="label" fill="#E5489B">rules</text>
<rect x="40" y="508" width="5" height="32" fill="#8B5CF6"/>
<rect x="40" y="524" width="5" height="16" fill="#C4511A"/>
<text x="62" y="530" class="sans" font-size="17" fill="#141A2E"><tspan font-weight="700">Services never call each other.</tspan> The hub routes every event; each service reads at its own pace.</text>
</svg>
