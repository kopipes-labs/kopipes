<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-label="Record first, then act from the table&#x27;s stream">

  <style>
    .sans { font-family: Helvetica, Arial, sans-serif; }
    .mono { font-family: SFMono-Regular, Menlo, Consolas, monospace; }
    .kicker { font-family: SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
    .title { font-family: Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #141A2E; }
    .sub { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #5B6270; }
    .code { font-family: SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #141A2E; }
    .label { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #141A2E; }
    .note { font-family: Helvetica, Arial, sans-serif; font-size: 13px; font-style: italic; fill: #5B6270; }
  </style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141A2E"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5489B"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C4511A"/></marker><marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B5CF6"/></marker></defs>
<rect width="1100" height="620" fill="#FFFFFF"/>
<text x="40" y="44" class="kicker" fill="#C4511A">PATTERN · CONTROL SERVICE</text>
<text x="40" y="80" class="sans" font-size="28" font-weight="700" fill="#141A2E">Record first, then act from the table&#x27;s stream</text>
<rect x="40" y="110" width="1020" height="240" rx="14" fill="#F5F3EE" stroke="#8B5CF6" stroke-width="2"/>
<text x="60" y="138" class="kicker" fill="#8B5CF6">CONTROL SERVICE</text>
<rect x="80" y="160" width="260" height="130" rx="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
<text x="96" y="184" class="kicker" fill="#8B5CF6">λ LISTENER</text>
<text x="96" y="206" class="title">1 · Collect</text>
<text x="96" y="226" class="sub">saves each event it hears,</text>
<text x="96" y="243" class="sub">under its own id</text>
<text x="96" y="260" class="code">CollectPipeline</text>
<rect x="420" y="160" width="260" height="130" rx="10" fill="#FFFFFF" stroke="#C4511A" stroke-width="2"/>
<text x="436" y="184" class="kicker" fill="#C4511A">DYNAMODB</text>
<text x="436" y="206" class="title">Events table</text>
<text x="436" y="226" class="sub">the events microstore:</text>
<text x="436" y="243" class="sub">what the service has heard</text>
<text x="436" y="260" class="code">pk · sk · ttl · stream</text>
<rect x="760" y="160" width="260" height="130" rx="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
<text x="776" y="184" class="kicker" fill="#8B5CF6">λ TRIGGER</text>
<text x="776" y="206" class="title">2 · Correlate  3 · Evaluate</text>
<text x="776" y="226" class="sub">groups events by entity, runs</text>
<text x="776" y="243" class="sub">the rules, emits new events</text>
<text x="776" y="260" class="code">CorrelatePipeline</text>
<text x="776" y="276" class="code">EvaluatePipeline</text>
<path d="M340,205 H418" fill="none" stroke="#141A2E" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="364.1" y="185" width="29.8" height="18" fill="#FFFFFF" opacity="0.92" rx="3"/>
<text x="379" y="198" text-anchor="middle" class="label">put</text>
<path d="M680,205 H758" fill="none" stroke="#141A2E" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="694.2" y="185" width="49.6" height="18" fill="#FFFFFF" opacity="0.92" rx="3"/>
<text x="719" y="198" text-anchor="middle" class="label">stream</text>
<path d="M758,262 H682" fill="none" stroke="#141A2E" stroke-width="1.8" marker-end="url(#a)"/>
<text x="720" y="280" text-anchor="middle" class="label">correlate</text>
<rect x="280" y="420" width="540" height="120" rx="14" fill="#FCEFF6" stroke="#E5489B" stroke-width="2"/>
<text x="300" y="448" class="kicker" fill="#E5489B">EVENT HUB</text>
<rect x="310" y="455" width="220" height="70" rx="10" fill="#FFFFFF" stroke="#E5489B" stroke-width="2"/>
<text x="326" y="479" class="kicker" fill="#E5489B">KINESIS</text>
<text x="326" y="501" class="title">Channel s1</text>
<rect x="570" y="455" width="220" height="70" rx="10" fill="#FFFFFF" stroke="#E5489B" stroke-width="2"/>
<text x="586" y="479" class="kicker" fill="#E5489B">EVENTBRIDGE</text>
<text x="586" y="501" class="title">Bus</text>
<path d="M570,490 H532" fill="none" stroke="#E5489B" stroke-width="1.8" marker-end="url(#p)"/>
<text x="551" y="512" text-anchor="middle" class="label" fill="#E5489B">rule</text>
<path d="M420,455 V385 H210 V292" fill="none" stroke="#141A2E" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="280.3" y="367" width="69.4" height="18" fill="#FFFFFF" opacity="0.92" rx="3"/>
<text x="315" y="380" text-anchor="middle" class="label">events in</text>
<path d="M890,292 V385 H680 V453" fill="none" stroke="#141A2E" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="704.1" y="367" width="161.8" height="18" fill="#FFFFFF" opacity="0.92" rx="3"/>
<text x="785" y="380" text-anchor="middle" class="label">higher-order events out</text>
<rect x="40" y="568" width="5" height="32" fill="#8B5CF6"/>
<rect x="40" y="584" width="5" height="16" fill="#C4511A"/>
<text x="62" y="590" class="sans" font-size="17" fill="#141A2E"><tspan font-weight="700">Write first, act later.</tspan> A redelivered event writes the same item again, and no rule acts on an unrecorded fact.</text>
</svg>
