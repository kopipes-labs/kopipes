<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Gateways at the edges, the core in the middle">

  <style>
    .sans { font-family: Helvetica, Arial, sans-serif; }
    .mono { font-family: SFMono-Regular, Menlo, Consolas, monospace; }
    .kicker { font-family: SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
    .title { font-family: Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #141A2E; }
    .sub { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #5B6270; }
    .code { font-family: SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #141A2E; }
    .label { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #141A2E; }
    .note { font-family: Helvetica, Arial, sans-serif; font-size: 13px; font-style: italic; fill: #5B6270; }
  </style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141A2E"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5489B"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C4511A"/></marker><marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B5CF6"/></marker></defs>
<rect width="1200" height="720" fill="#FFFFFF"/>
<text x="40" y="44" class="kicker" fill="#C4511A">ARCHITECTURE · AUTONOMOUS SUBSYSTEM</text>
<text x="40" y="80" class="sans" font-size="28" font-weight="700" fill="#141A2E">Gateways at the edges, the core in the middle</text>
<rect x="480" y="104" width="240" height="50" rx="10" fill="#FFFFFF" stroke="#E2DED4" stroke-width="2"/>
<text x="500" y="135" text-anchor="start" class="kicker" fill="#8B5CF6">USER</text>
<text x="556" y="135" text-anchor="start" class="title">Web or mobile app</text>
<polygon points="150.0,410.0 270.0,170.0 930.0,170.0 1050.0,410.0 930.0,650.0 270.0,650.0" fill="#F5F3EE" stroke="#8B5CF6" stroke-width="2.5"/>
<text x="250" y="225" text-anchor="start" class="kicker" fill="#8B5CF6">INGRESS · PRODUCE</text>
<text x="950" y="225" text-anchor="end" class="kicker" fill="#8B5CF6">EGRESS · CONSUME</text>
<polygon points="410.0,410.0 480.0,210.0 720.0,210.0 790.0,410.0 720.0,610.0 480.0,610.0" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="482" y="252" text-anchor="start" class="kicker" fill="#8B5CF6">CORE</text>
<rect x="455" y="262" width="290" height="66" rx="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
<text x="471" y="286" class="kicker" fill="#8B5CF6">BFF</text>
<text x="471" y="308" class="title">API + its own read model</text>
<rect x="440" y="378" width="320" height="64" rx="10" fill="#FCEFF6" stroke="#E5489B" stroke-width="2"/>
<text x="456" y="402" class="kicker" fill="#E5489B">EVENT HUB</text>
<text x="456" y="424" class="title">Bus · channels · lake · faults</text>
<rect x="455" y="492" width="290" height="66" rx="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
<text x="471" y="516" class="kicker" fill="#8B5CF6">CONTROL SERVICE</text>
<text x="471" y="538" class="title">Runs the business process</text>
<path d="M600,154 V260" fill="none" stroke="#141A2E" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M600,330 V376" fill="none" stroke="#141A2E" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M600,444 V490" fill="none" stroke="#141A2E" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="612" y="357" text-anchor="start" class="sub">publish · consume</text>
<text x="612" y="471" text-anchor="start" class="sub">consume · publish</text>
<polygon points="215.0,328.0 237.0,290.0 383.0,290.0 405.0,328.0 383.0,366.0 237.0,366.0" fill="#FFFFFF" stroke="#E5489B" stroke-width="2"/>
<text x="245" y="314" class="kicker" fill="#E5489B">INGRESS ESG</text>
<text x="245" y="336" class="title">outside → events</text>
<text x="245" y="356" class="code">TranslatePipeline</text>
<polygon points="220.0,498.0 242.0,460.0 388.0,460.0 410.0,498.0 388.0,536.0 242.0,536.0" fill="#FFFFFF" stroke="#E5489B" stroke-width="2"/>
<text x="250" y="484" class="kicker" fill="#E5489B">INGRESS ESG</text>
<text x="250" y="506" class="title">outside → events</text>
<text x="250" y="526" class="code">TranslatePipeline</text>
<polygon points="795.0,328.0 817.0,290.0 963.0,290.0 985.0,328.0 963.0,366.0 817.0,366.0" fill="#FFFFFF" stroke="#E5489B" stroke-width="2"/>
<text x="825" y="314" class="kicker" fill="#E5489B">EGRESS ESG</text>
<text x="825" y="336" class="title">events → calls</text>
<text x="825" y="356" class="code">ActionPipeline</text>
<polygon points="790.0,498.0 812.0,460.0 958.0,460.0 980.0,498.0 958.0,536.0 812.0,536.0" fill="#FFFFFF" stroke="#C4511A" stroke-width="2"/>
<text x="820" y="484" class="kicker" fill="#C4511A">EGRESS ESG</text>
<text x="820" y="506" class="title">events → outside</text>
<text x="820" y="526" class="code">CdcPipeline</text>
<rect x="20" y="300" width="140" height="56" rx="10" fill="#FFFFFF" stroke="#AAB2C1" stroke-width="2" stroke-dasharray="5 5"/>
<text x="36" y="324" class="kicker" fill="#AAB2C1">LEGACY</text>
<text x="36" y="346" class="title">Core system</text>
<rect x="20" y="470" width="140" height="56" rx="10" fill="#FFFFFF" stroke="#AAB2C1" stroke-width="2" stroke-dasharray="5 5"/>
<text x="36" y="494" class="kicker" fill="#AAB2C1">SAAS</text>
<text x="36" y="516" class="title">Third party</text>
<rect x="1040" y="300" width="140" height="56" rx="10" fill="#FFFFFF" stroke="#AAB2C1" stroke-width="2" stroke-dasharray="5 5"/>
<text x="1056" y="324" class="kicker" fill="#AAB2C1">SAAS</text>
<text x="1056" y="346" class="title">Third party</text>
<rect x="1040" y="470" width="140" height="56" rx="10" fill="#FFFFFF" stroke="#AAB2C1" stroke-width="2" stroke-dasharray="5 5"/>
<text x="1056" y="494" class="kicker" fill="#AAB2C1">SUBSYSTEM</text>
<text x="1056" y="516" class="title">Another one</text>
<path d="M160,328 H213" fill="none" stroke="#141A2E" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M160,498 H218" fill="none" stroke="#141A2E" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M985,328 H1038" fill="none" stroke="#141A2E" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M980,498 H1038" fill="none" stroke="#141A2E" stroke-width="1.8" marker-end="url(#a)"/>
<text x="600" y="626" text-anchor="middle" class="note">Every gateway publishes to or consumes from the hub; arrows to it are left out.</text>
<rect x="40" y="668" width="5" height="32" fill="#8B5CF6"/>
<rect x="40" y="684" width="5" height="16" fill="#C4511A"/>
<text x="62" y="690" class="sans" font-size="17" fill="#141A2E"><tspan font-weight="700">The ports are the events.</tspan> Ingress gateways turn the outside world into facts, the core reacts, egress gateways act.</text>
</svg>
