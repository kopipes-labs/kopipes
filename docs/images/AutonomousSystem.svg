<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-label="A system is a set of autonomous subsystems">

  <style>
    .sans { font-family: Helvetica, Arial, sans-serif; }
    .mono { font-family: SFMono-Regular, Menlo, Consolas, monospace; }
    .kicker { font-family: SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
    .title { font-family: Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #141A2E; }
    .sub { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #5B6270; }
    .code { font-family: SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #141A2E; }
    .label { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #141A2E; }
    .note { font-family: Helvetica, Arial, sans-serif; font-size: 13px; font-style: italic; fill: #5B6270; }
  </style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141A2E"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5489B"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C4511A"/></marker><marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B5CF6"/></marker></defs>
<rect width="1120" height="600" fill="#FFFFFF"/>
<text x="40" y="44" class="kicker" fill="#C4511A">ARCHITECTURE · AUTONOMOUS SYSTEM</text>
<text x="40" y="80" class="sans" font-size="28" font-weight="700" fill="#141A2E">A system is a set of autonomous subsystems</text>
<rect x="110" y="104" width="220" height="50" rx="10" fill="#FFFFFF" stroke="#E2DED4" stroke-width="2"/>
<text x="130" y="135" text-anchor="start" class="kicker" fill="#8B5CF6">USER</text>
<text x="188" y="135" text-anchor="start" class="title">Customer app</text>
<rect x="40" y="180" width="1040" height="330" rx="14" fill="#FBF1EA" stroke="#C4511A" stroke-width="2"/>
<text x="60" y="208" class="kicker" fill="#C4511A">AUTONOMOUS SYSTEM</text>
<polygon points="90.0,345.0 145.0,235.0 295.0,235.0 350.0,345.0 295.0,455.0 145.0,455.0" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2.5"/>
<text x="220" y="300" text-anchor="middle" class="kicker" fill="#8B5CF6">SUBSYSTEM</text>
<text x="220" y="325" text-anchor="middle" class="title">Payments</text>
<text x="220" y="347" text-anchor="middle" class="sub">submits and settles</text>
<text x="220" y="378" text-anchor="middle" class="code">its own event hub</text>
<text x="220" y="396" text-anchor="middle" class="code">its own services</text>
<text x="220" y="414" text-anchor="middle" class="code">its own account</text>
<polygon points="450.0,345.0 505.0,235.0 655.0,235.0 710.0,345.0 655.0,455.0 505.0,455.0" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2.5"/>
<text x="580" y="300" text-anchor="middle" class="kicker" fill="#8B5CF6">SUBSYSTEM</text>
<text x="580" y="325" text-anchor="middle" class="title">Accounts</text>
<text x="580" y="347" text-anchor="middle" class="sub">owns customer accounts</text>
<text x="580" y="378" text-anchor="middle" class="code">its own event hub</text>
<text x="580" y="396" text-anchor="middle" class="code">its own services</text>
<text x="580" y="414" text-anchor="middle" class="code">its own account</text>
<polygon points="810.0,345.0 865.0,235.0 1015.0,235.0 1070.0,345.0 1015.0,455.0 865.0,455.0" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2.5"/>
<text x="940" y="300" text-anchor="middle" class="kicker" fill="#8B5CF6">SUBSYSTEM</text>
<text x="940" y="325" text-anchor="middle" class="title">Notifications</text>
<text x="940" y="347" text-anchor="middle" class="sub">tells customers</text>
<text x="940" y="378" text-anchor="middle" class="code">its own event hub</text>
<text x="940" y="396" text-anchor="middle" class="code">its own services</text>
<text x="940" y="414" text-anchor="middle" class="code">its own account</text>
<path d="M220,154 V233" fill="none" stroke="#141A2E" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="205.1" y="183" width="29.8" height="18" fill="#FFFFFF" opacity="0.92" rx="3"/>
<text x="220" y="196" text-anchor="middle" class="label">API</text>
<path d="M352,345 H446" fill="none" stroke="#E5489B" stroke-width="1.8" marker-end="url(#p)"/>
<text x="400" y="330" text-anchor="middle" class="label" fill="#E5489B">external</text>
<text x="400" y="368" text-anchor="middle" class="label" fill="#E5489B">events</text>
<path d="M712,345 H806" fill="none" stroke="#E5489B" stroke-width="1.8" marker-end="url(#p)"/>
<text x="760" y="330" text-anchor="middle" class="label" fill="#E5489B">external</text>
<text x="760" y="368" text-anchor="middle" class="label" fill="#E5489B">events</text>
<text x="560" y="490" text-anchor="middle" class="note">Subsystems share only external events and APIs, with stable, versioned contracts.</text>
<rect x="40" y="543" width="5" height="32" fill="#8B5CF6"/>
<rect x="40" y="559" width="5" height="16" fill="#C4511A"/>
<text x="62" y="565" class="sans" font-size="17" fill="#141A2E"><tspan font-weight="700">Subsystems are bulkheads.</tspan> A failure or a change inside one stays inside it.</text>
</svg>
