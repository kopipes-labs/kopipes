<rect x="40" y="814" width="5" height="16" fill="#C4511A"/>
<text x="62" y="820" class="sans" font-size="17" fill="#141A2E"><tspan font-weight="700">Conservative by design.</tspan> Server-side errors in either dependency make the region unhealthy; missing data doesn&#x27;t.</text>
